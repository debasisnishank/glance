[package]
name = "glance"
version = "0.1.0"
description = "Screen → LLM → Actions"
authors = ["Debasis Nishank"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "process", "io-util"] }
futures-util = "0.3.34"
async-trait = "0.1.92"
toml = "1.1.6"
dirs = "7.0.0"
tauri-plugin-clipboard-manager = "2"
keyring = "4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
screencapturekit = { version = "11", features = ["macos_15_2"] }

# Image encoding is painfully slow unoptimized; speed it up in dev builds.
[profile.dev.package]
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
adler2 = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
